name: Update personal feature catalog

on:
  push:
    branches: [dev]
    paths-ignore:
      - FORK_FEATURES.md
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: fork-catalog-dev
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'GXinOvO/hermes-agent' && github.ref == 'refs/heads/dev'
    runs-on: [fork-catalog]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev
          fetch-depth: 0
          sparse-checkout: |
            FORK_FEATURES.md
            scripts/ci/update_fork_catalog.py
          sparse-checkout-cone-mode: false
      - name: Update the catalog and publish
        env:
          FORK_CATALOG_API_KEY: ${{ secrets.FORK_CATALOG_API_KEY }}
          FORK_CATALOG_BASE_URL: ${{ vars.FORK_CATALOG_BASE_URL }}
          FORK_CATALOG_MODEL: ${{ vars.FORK_CATALOG_MODEL }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin dev
            git reset --hard origin/dev
            python3 scripts/ci/update_fork_catalog.py
            test -z "$(git status --porcelain -- . ':!FORK_FEATURES.md')"
            git add -- FORK_FEATURES.md
            if git diff --cached --quiet; then
              exit 0
            fi
            git diff --cached --check
            git commit -m 'docs(fork): refresh personal feature catalog'
            if git push origin HEAD:refs/heads/dev; then
              exit 0
            fi
          done
          exit 1
