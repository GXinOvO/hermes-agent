name: Remote terminal backends

# The SSH and Docker terminal backends against a real sshd and a real Docker
# daemon. Every other test of these backends mocks subprocess / the docker CLI;
# the gated real-backend tests in tests/tools/test_ssh_environment.py skipped on
# every CI run because nothing provided a host.
#
# This job provides one: a throwaway sshd container on 127.0.0.1 that accepts a
# keypair generated for this run only (scripts/ci/start_test_sshd.sh), plus the
# runner's own Docker daemon with a small public image. No secrets are involved
# and none may be added: ci.yaml runs PR-controlled code.
#
# ci.yaml calls this only when a PR touches the backends (the classifier's
# `remote_backends` lane) and on every push to main.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: remote-backends-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

env:
  # The original digest remains available for the no-Python fail-closed test.
  # The normal backend image adds Python for the file-state probe.
  HERMES_TEST_BASE_IMAGE: debian:trixie-20261020-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  HERMES_TEST_IMAGE_REF: hermes-test-backend:ci

jobs:
  real-backends:
    name: SSH + Docker backends (real sshd, real daemon)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit }}

      - name: Pull the test image
        uses: ./.github/actions/retry
        with:
          command: docker pull -q "$HERMES_TEST_BASE_IMAGE"

      - name: Prepare the file-probe test image
        run: |
          printf 'FROM %s\nRUN apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 && rm -rf /var/lib/apt/lists/*\n' \
            "$HERMES_TEST_BASE_IMAGE" | docker build -q -t "$HERMES_TEST_IMAGE_REF" -
          docker run --rm "$HERMES_TEST_IMAGE_REF" /usr/bin/python3 -c 'import contextlib, hashlib, json, secrets'

      - name: Start a throwaway sshd
        # Exports HERMES_TEST_SSH_{HOST,USER,PORT,KEY} through $GITHUB_ENV.
        env:
          HERMES_TEST_SSHD_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
        run: scripts/ci/start_test_sshd.sh "$RUNNER_TEMP/hermes-test-sshd"

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Verify file probes fail closed without Python
        env:
          HERMES_TEST_DOCKER_IMAGE: ${{ env.HERMES_TEST_BASE_IMAGE }}
        run: scripts/run_tests.sh --fail-on-skip tests/tools/test_docker_backend_no_python.py

      - name: Run the real-backend tests
        env:
          HERMES_TEST_DOCKER_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        # The real tests skip when their host is missing; here that would be a green
        # lane over zero coverage. --fail-on-skip fails the run on any skip, decided
        # from pytest's parsed counts rather than the progress line's display format.
        run: |
          if ! scripts/run_tests.sh --fail-on-skip \
              tests/tools/test_ssh_environment.py tests/tools/test_docker_backend_real.py; then
            echo "::error::real-backend tests failed or skipped (a skip means the sshd or docker image was not wired through)"
            exit 1
          fi

      - name: sshd log
        if: failure()
        run: docker logs hermes-test-sshd || true
